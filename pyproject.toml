[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tamagotchi"
version = "0.1.0"
description = "A faithful Tamagotchi clone that runs in your terminal."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Tamagotchi Clone Contributors" }]
keywords = ["tamagotchi", "game", "terminal", "tui", "pet"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Games/Entertainment :: Simulation",
]
dependencies = ["rich>=13.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
tamagotchi = "tamagotchi.__main__:main"

[project.urls]
Homepage = "https://github.com/poonsai/tamagatchi"

[tool.hatch.build.targets.wheel]
packages = ["src/tamagotchi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
